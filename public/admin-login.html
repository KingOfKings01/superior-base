<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #2d3748; color: #1a202c; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .login-box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); width: 100%; max-width: 400px; }
    h1 { margin-top: 0; color: #2d3748; text-align: center; margin-bottom: 30px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; color: #4a5568; }
    input { width: 100%; padding: 12px; border: 1px solid #cbd5e0; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
    .btn { width: 100%; padding: 12px; background-color: #3182ce; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 16px; margin-top: 10px; }
    .btn:hover { background-color: #2b6cb0; }
    #error { color: #e53e3e; text-align: center; margin-top: 15px; font-weight: 600; display: none; }
  </style>
</head>
<body>

  <div class="login-box">
    <h1>Site Administration</h1>
    <form id="loginForm">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" class="btn">Log In</button>
      <div id="error"></div>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('error');
      errEl.style.display = 'none';

      try {
        const res = await fetch('/admin-api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        
        const data = await res.json();
        
        if (!res.ok) {
          errEl.textContent = data.message || 'Login failed';
          errEl.style.display = 'block';
          return;
        }

        localStorage.setItem('admin_token', data.token);
        window.location.href = '/admin';
      } catch (err) {
        errEl.textContent = 'An error occurred';
        errEl.style.display = 'block';
      }
    });
  </script>

</body>
</html>
